[package]
name = "hm-app"
description = "HealthyMac desktop app, built with GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Not `HealthyMac`: on a case-insensitive disk that is the same file as the CLI's `healthymac`, and
# whichever is built last replaces the other. scripts/bundle.sh gives it its name inside the bundle.
[[bin]]
name = "healthymac-app"
path = "src/main.rs"

[dependencies]
hm-core.workspace = true
hm-system.workspace = true
hm-dev.workspace = true
hm-ai.workspace = true
anyhow.workspace = true
gpui.workspace = true
futures = "0.3.34"
icns = "0.3.1"
